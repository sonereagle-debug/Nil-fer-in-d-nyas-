workflows:
  android-release:
    name: Nilüfer'in Dünyası Android APK
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Flutter dependencies
        script: flutter pub get
      - name: Ensure Android project
        script: flutter create . --platforms=android --project-name=niluferin_dunyasi
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
